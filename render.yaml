# Render service definition — deploys the Express API backend.
# https://render.com/docs/blueprint-spec
#
# IMPORTANT: This file lives at the REPO ROOT on the
# `claude/hopeful-hellman-6f7a38` branch. The chamber site code is at the
# branch root too — package.json, server.js, backend/, etc. all sit at /.
# Do NOT set Render's "Root directory" to anything else.
#
# Recommended setup (Web Service, NOT Blueprint — Blueprint locks bad paths):
#   1. Render dashboard → New + → Web Service
#   2. Connect HeedAIConsulting/Heedbusinesssolutions
#   3. Branch: claude/hopeful-hellman-6f7a38
#   4. Root directory: (leave BLANK)
#   5. Build command: npm install
#   6. Start command: node server.js
#   7. Health check path: /api/chamber
#   8. Environment vars (set in dashboard, never committed):
#        GEMINI_API_KEY
#        ANTHROPIC_API_KEY            (optional fallback)
#        MS_GRAPH_TENANT_ID
#        MS_GRAPH_CLIENT_ID
#        MS_GRAPH_CLIENT_SECRET
#        M365_PRIMARY_MAILBOX         e.g. wendy@woodlandhillscc.net
#        M365_REDIRECT_URI            https://<service>.onrender.com/auth/m365/callback
#        COOKIE_SECRET                any random 32+ char string
#   9. After first deploy, add M365_REDIRECT_URI to Azure portal →
#        WVWCC Chamber Site → Authentication → Web platform → Redirect URIs.
#  10. Update js/api-base.js RENDER_API_BASE constant to your actual onrender.com URL.
#
# Free tier: instance sleeps after 15 min idle, ~30s cold start. Fine for demos.
services:
  - type: web
    name: wvwccc-chamber-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev || npm install --production
    startCommand: node server.js
    healthCheckPath: /api/chamber
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # The secrets below are not committed — set them in the Render dashboard.
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MS_GRAPH_TENANT_ID
        sync: false
      - key: MS_GRAPH_CLIENT_ID
        sync: false
      - key: MS_GRAPH_CLIENT_SECRET
        sync: false
      - key: M365_PRIMARY_MAILBOX
        sync: false
      - key: M365_REDIRECT_URI
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
