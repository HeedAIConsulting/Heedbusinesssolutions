<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact · West Valley Chamber</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/chamber.css?v=6">
</head>
<body>
<div data-partial="header"></div>

<section class="page-hero">
  <div class="container page-hero__inner">
    <div class="breadcrumb"><a href="index.html">Home</a> / Contact</div>
    <h1>Get in touch</h1>
    <p>Have a question, an idea, or want to join? We'd love to hear from you.</p>
  </div>
</section>

<section class="section bg-cream">
  <div class="container">
    <div class="grid" style="grid-template-columns:1.5fr 1fr;gap:32px;">
      <div class="card" style="padding:32px;">
        <h2 style="font-size:1.4rem;margin-bottom:24px;">Send a message</h2>
        <form id="contact-form">
          <div class="form-row">
            <div class="form-group"><label>First name *</label><input type="text" required></div>
            <div class="form-group"><label>Last name *</label><input type="text" required></div>
          </div>
          <div class="form-group"><label>Email *</label><input type="email" required></div>
          <div class="form-group"><label>Phone</label><input type="tel"></div>
          <div class="form-group">
            <label>I'm reaching out about *</label>
            <select required>
              <option value="">Choose one…</option>
              <option>Membership</option>
              <option>Sponsorship</option>
              <option>Premium Listings</option>
              <option>Events</option>
              <option>Press / Media</option>
              <option>Donations &amp; Foundation</option>
              <option>Volunteering</option>
              <option>Something else</option>
            </select>
          </div>
          <div class="form-group"><label>Message *</label><textarea rows="5" required></textarea></div>
          <button type="submit" class="btn btn--gold btn--lg">Send</button>
        </form>
      </div>

      <aside>
        <div class="card" style="padding:24px;">
          <h3 style="font-size:1.1rem;margin-bottom:12px;">Office</h3>
          <div style="font-size:.95rem;line-height:1.7;">
            <div>📞 <a href="tel:8183474737">(818) 347-4737</a></div>
            <div>✉️ <a href="mailto:info@wvwcc.org">info@wvwcc.org</a></div>
            <div>📍 Woodland Hills, CA</div>
          </div>
          <div class="divider"></div>
          <h4 style="font-family:var(--mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold-deep);margin-bottom:8px;">Office hours</h4>
          <div class="text-sm">Mon–Fri · 9 AM – 5 PM PT<br>Concierge: 24/7</div>
        </div>

        <div class="mt-4" style="background:var(--navy);border-radius:var(--r-lg);padding:6px;">
          <div data-partial="concierge-inline" data-variant="card" data-prompt="Have a quick question? The Concierge answers most things in seconds — no need to wait for office hours."></div>
        </div>
      </aside>
    </div>
  </div>
</section>

<div data-partial="footer"></div>
<script>window.CHAMBER_API_BASE='/api';</script>
<script src="js/partials.js?v=6"></script>
<script src="js/chamber.js?v=6"></script>
<script>
ChamberPartials.mount({});
document.getElementById('contact-form').addEventListener('submit', e => { e.preventDefault(); alert('Message sent. We\'ll get back to you within one business day.'); });
</script>
</body>
</html>
