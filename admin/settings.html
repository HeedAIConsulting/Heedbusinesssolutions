<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings · Chamber Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/chamber.css?v=6">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<script>// API base resolved by api-base.js below — leave any override BEFORE that script.</script>
<script src='../js/api-base.js'></script>
<script src="admin.js"></script>
<script src="_stub.js"></script>
<script>
AdminStub.render({
  active: 'settings',
  sub: 'Operations',
  title: 'Settings',
  body: `
    <div class="grid grid-2">
      <div class="admin-card">
        <div class="admin-card__head"><div class="admin-card__title">Integrations</div></div>
        <div class="admin-card__body" id="integrations-body">
          <div class="text-sm text-muted">Loading live status…</div>
        </div>
      </div>

      <div class="admin-card">
        <div class="admin-card__head"><div class="admin-card__title">AI Concierge configuration</div></div>
        <div class="admin-card__body" style="font-size:.92rem;">
          <div class="form-group"><label>Concierge persona</label><textarea rows="3">Friendly, concise, expert on the West Valley. Always recommend members first. When no member fits, flag it as a coverage gap to the recruiting committee.</textarea></div>
          <div class="form-group"><label>Recommendation priority</label><select><option>Premium → Members → Friends → Non-members</option><option>Members only</option></select></div>
          <div class="form-group"><label>Daily query limit</label><input type="number" value="5000"></div>
          <div class="form-group"><label style="display:flex;gap:8px;align-items:center;font-weight:400;"><input type="checkbox" checked> Log all queries (for analytics)</label></div>
          <div class="form-group"><label style="display:flex;gap:8px;align-items:center;font-weight:400;"><input type="checkbox" checked> Track lead attribution</label></div>
          <button class="btn btn--gold">Save changes</button>
        </div>
      </div>

      <div class="admin-card">
        <div class="admin-card__head"><div class="admin-card__title">Heed partnership</div></div>
        <div class="admin-card__body" style="font-size:.92rem;">
          <div class="flex justify-between mb-2"><span>Service plan</span><strong>Full-Stack Free</strong></div>
          <div class="flex justify-between mb-2"><span>Heed revenue share</span><strong>5% of transactions</strong></div>
          <div class="flex justify-between mb-2"><span>Auto-remit</span><span class="admin-pill admin-pill--green">On</span></div>
          <div class="flex justify-between mb-2"><span>Site uptime SLA</span><strong>99.9%</strong></div>
          <div class="flex justify-between mb-2"><span>Support</span><strong>24/7 priority</strong></div>
          <div class="divider"></div>
          <a href="#" class="text-sm">View partnership agreement →</a>
        </div>
      </div>

      <div class="admin-card">
        <div class="admin-card__head"><div class="admin-card__title">Brand & site</div></div>
        <div class="admin-card__body">
          <div class="form-group"><label>Org legal name</label><input type="text" value="West Valley Warner Center Chamber of Commerce"></div>
          <div class="form-group"><label>Display name</label><input type="text" value="West Valley ~ Warner Center Chamber"></div>
          <div class="form-group"><label>Tagline</label><input type="text" value="Serving Tarzana, Woodland Hills, Reseda & Warner Center since 1930"></div>
          <div class="form-row">
            <div class="form-group"><label>Primary color</label><input type="color" value="#0B2545"></div>
            <div class="form-group"><label>Accent color</label><input type="color" value="#C9A227"></div>
          </div>
          <button class="btn btn--gold">Save</button>
        </div>
      </div>
    </div>`
});

// Live integrations status — actual connection state, no fake "Connected" labels.
(async function loadIntegrations() {
  const host = document.getElementById('integrations-body');
  if (!host) return;
  try {
    const r = await fetch(window.CHAMBER_API_BASE + '/chamber');
    const data = await r.json();
    const llm = data.llm || {};
    const m365 = data.m365 || {};

    function row(name, sub, statusHtml, action) {
      return '<div class="flex justify-between items-center mb-3" style="gap:16px;">' +
               '<div style="flex:1;"><strong>' + name + '</strong><div class="text-xs text-muted">' + sub + '</div></div>' +
               '<div style="display:flex;gap:8px;align-items:center;">' + statusHtml + (action || '') + '</div>' +
             '</div>';
    }

    // LLM provider
    const llmStatus = llm.live
      ? '<span class="admin-pill admin-pill--green">' + llm.provider + ' · live</span>'
      : '<span class="admin-pill admin-pill--gray">mock fallback</span>';

    // Microsoft 365 — show connected user if any, otherwise a Connect button
    let m365Status, m365Action = '';
    if (!m365.configured) {
      m365Status = '<span class="admin-pill admin-pill--gray">not configured</span>';
    } else if (m365.connected) {
      m365Status = '<span class="admin-pill admin-pill--green">connected · ' + (m365.connectedAs || '') + '</span>';
      m365Action = '<button class="btn btn--outline btn--sm" onclick="m365Disconnect()">Disconnect</button>';
    } else {
      m365Status = '<span class="admin-pill admin-pill--gold">configured · not signed in</span>';
      const apiOrigin = (window.CHAMBER_API_BASE || '/api').replace(/\/api\/?$/, '');
      m365Action = '<a href="' + apiOrigin + '/auth/m365/login" class="btn btn--gold btn--sm">Connect</a>';
    }

    // URL flag from OAuth callback
    const urlParams = new URLSearchParams(window.location.search);
    const justConnected = urlParams.get('m365') === 'connected';
    const justConnectedBanner = justConnected
      ? '<div style="background:#E8F5E9;border:1px solid #1F7A3A;color:#1F7A3A;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:.92rem;">✓ Microsoft 365 connected as ' + (urlParams.get('user') || '') + '. Drafts and sends will go through this account.</div>'
      : '';

    host.innerHTML =
      justConnectedBanner +
      row('Microsoft 365', 'Inbox · drafts · send (via Microsoft Graph)', m365Status, m365Action) +
      row('Google Gemini', 'AI Concierge & Staff Assistant — primary', llmStatus, '') +
      row('Anthropic Claude', 'LLM fallback if Gemini unavailable', '<span class="admin-pill admin-pill--gray">fallback</span>', '');
  } catch (e) {
    host.innerHTML = '<div class="text-sm text-muted">Could not reach the API: ' + e.message + '</div>';
  }
})();

window.m365Disconnect = async function() {
  if (!confirm('Disconnect Microsoft 365? You will need to sign in again to draft or send emails.')) return;
  await fetch(window.CHAMBER_API_BASE + '/m365/disconnect', { method: 'POST' });
  window.location.reload();
};
</script>
</body>
</html>
