<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Members · Diana's Console</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/chamber.css?v=4">
<link rel="stylesheet" href="admin.css">
<style>
  .tabs { display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:20px; flex-wrap:wrap; }
  .tab { padding:10px 16px; background:none; border:none; border-bottom:3px solid transparent; cursor:pointer; font:inherit; font-weight:500; color:var(--slate); }
  .tab.active { border-bottom-color:var(--gold); color:var(--navy); }
  .tab__count { display:inline-block; margin-left:6px; padding:1px 8px; background:var(--cream); border-radius:var(--r-full); font-size:.75rem; color:var(--slate-mid); }
  .tab.active .tab__count { background:var(--gold); color:var(--navy); }

  .member-row { display:grid; grid-template-columns: 2fr 1fr 1fr 1fr 130px; gap:12px; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line-soft); font-size:.88rem; }
  .member-row--head { background:var(--cream); font-family:var(--mono); font-size:.7rem; text-transform:uppercase; letter-spacing:.1em; color:var(--gold-deep); position:sticky; top:0; z-index:1; }
  .member-row__name { font-weight:600; color:var(--navy); }
  .member-row__sub { font-size:.78rem; color:var(--muted); }
  .member-row__date { font-family:var(--mono); font-size:.78rem; }
  .lapsed { color:var(--red); font-weight:600; }
  .upcoming { color:var(--gold-deep); font-weight:600; }
  .row-action { padding:6px 10px; font-size:.78rem; border:1px solid var(--line); background:var(--paper); border-radius:var(--r-md); cursor:pointer; font:inherit; font-weight:500; }
  .row-action:hover { background:var(--gold-soft); border-color:var(--gold); }
  .row-action--primary { background:var(--gold); border-color:var(--gold); color:var(--navy); }

  /* Email modal */
  .email-modal { position:fixed; inset:0; background:rgba(11,37,69,.65); display:none; align-items:center; justify-content:center; z-index:1000; padding:20px; }
  .email-modal.open { display:flex; }
  .email-modal__inner { background:var(--paper); border-radius:var(--r-lg); max-width:720px; width:100%; max-height:90vh; overflow:auto; box-shadow:var(--shadow-xl); }
  .email-modal__head { padding:20px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .email-modal__body { padding:24px; }
  .email-modal__subject { width:100%; padding:12px; font-size:1rem; font-weight:600; color:var(--navy); border:1px solid var(--line); border-radius:var(--r-md); margin-bottom:12px; }
  .email-modal__body-text { width:100%; min-height:300px; padding:12px; font-family:var(--sans); font-size:.95rem; line-height:1.6; border:1px solid var(--line); border-radius:var(--r-md); white-space:pre-wrap; }
  .email-modal__actions { padding:16px 24px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
  .email-modal__loading { padding:48px; text-align:center; color:var(--muted); }
  .email-modal__loading::before { content:""; display:inline-block; width:24px; height:24px; border:3px solid var(--line); border-top-color:var(--gold); border-radius:50%; animation:spin 800ms linear infinite; vertical-align:middle; margin-right:10px; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="admin-shell">
  <div data-admin="side"></div>
  <main class="admin-main">
    <div data-admin="top"></div>
    <div class="admin-content">

      <div class="admin-page-head">
        <div>
          <div class="admin-page-head__sub">Membership</div>
          <h1>Members</h1>
          <p class="text-muted">All chamber members. Filter by status — new joins, upcoming renewals, lapsed renewals.</p>
        </div>
        <div class="flex gap-3">
          <a href="onboarding.html" class="btn btn--outline">Onboarding queue</a>
          <a href="../onboard.html" class="btn btn--primary" target="_blank">+ Add member</a>
        </div>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-status="active">All active <span class="tab__count" id="c-active">—</span></button>
        <button class="tab" data-status="new">New (60d) <span class="tab__count" id="c-new">—</span></button>
        <button class="tab" data-status="upcoming">Upcoming renewals (30d) <span class="tab__count" id="c-upcoming">—</span></button>
        <button class="tab" data-status="lapsed">Lapsed <span class="tab__count" id="c-lapsed">—</span></button>
      </div>

      <div class="admin-card">
        <div class="admin-card__head">
          <div class="admin-card__title" id="list-title">All active members</div>
          <input type="search" id="search" placeholder="Search by name, contact, email…" style="padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-md);font:inherit;width:280px;">
        </div>
        <div class="admin-card__body admin-card__body--p0" style="max-height:65vh;overflow:auto;">
          <div class="member-row member-row--head">
            <div>Member</div>
            <div>Tier · Category</div>
            <div>Joined</div>
            <div>Renews</div>
            <div></div>
          </div>
          <div id="member-rows"><p style="padding:24px;text-align:center;color:var(--muted);">Loading…</p></div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- AI Renewal Email Modal -->
<div class="email-modal" id="email-modal">
  <div class="email-modal__inner">
    <div class="email-modal__head">
      <div>
        <h3 id="em-title">AI-drafted renewal email</h3>
        <p class="text-sm text-muted" id="em-meta"></p>
      </div>
      <button class="row-action" onclick="closeEmail()">×</button>
    </div>
    <div class="email-modal__body" id="em-body">
      <div class="email-modal__loading">Diana's AI assistant is drafting…</div>
    </div>
    <div class="email-modal__actions">
      <button class="row-action" onclick="copyEmail()">📋 Copy</button>
      <button class="row-action" onclick="regenerateEmail()">🔄 Regenerate</button>
      <button class="row-action" onclick="scheduleCall()" title="Open Google Calendar with a prefilled 15-min renewal call">📅 Schedule call</button>
      <button class="row-action row-action--primary" onclick="sendEmail()">✉️ Open in mail client</button>
    </div>
  </div>
</div>

<script src="admin.js"></script>
<script src="_stub.js"></script>
<script>
AdminShell.mount({ active: 'members' });

const $ = id => document.getElementById(id);
let activeStatus = 'active';
let activeQ = '';
let lastEmailContext = null;

async function load() {
  const params = new URLSearchParams({ status: activeStatus, q: activeQ, limit: 100 });
  let data;
  try {
    const r = await fetch('/api/admin/members?' + params);
    if (!r.ok) throw new Error('api ' + r.status);
    data = await r.json();
  } catch (e) {
    // Backend offline — fall back to client-side directory
    const dir = await fetch('/data/directory.json').then(r => r.json()).catch(() => []);
    const today = new Date().toISOString().slice(0,10);
    const enriched = dir.filter(m => m.chamberMember).map(m => {
      // Deterministic mock dates so tabs work offline
      const h = m.id.split('').reduce((a, c) => ((a<<5)-a + c.charCodeAt(0))|0, 0);
      const renewOffset = Math.abs(h) % 365;
      const r = new Date('2026-01-01'); r.setDate(r.getDate() + renewOffset);
      const renewalDate = r.toISOString().slice(0,10);
      const yearsAgo = (Math.abs(h) % 5) + 1;
      const j = new Date(r); j.setFullYear(j.getFullYear() - yearsAgo);
      const joinedDate = j.toISOString().slice(0,10);
      return { ...m, renewalDate, joinedDate };
    });
    const ago60 = new Date(); ago60.setDate(ago60.getDate() - 60);
    const in30 = new Date(); in30.setDate(in30.getDate() + 30);
    const ago14 = new Date(); ago14.setDate(ago14.getDate() - 14);
    let filtered = enriched;
    if (activeStatus === 'new') filtered = filtered.filter(m => new Date(m.joinedDate) > ago60);
    else if (activeStatus === 'upcoming') filtered = filtered.filter(m => m.renewalDate >= today && new Date(m.renewalDate) <= in30);
    else if (activeStatus === 'lapsed') filtered = filtered.filter(m => m.renewalDate < today && new Date(m.renewalDate) < ago14);
    if (activeQ) filtered = filtered.filter(m => (m.name+' '+(m.contactName||'')+' '+(m.email||'')).toLowerCase().includes(activeQ.toLowerCase()));
    if (activeStatus === 'lapsed' || activeStatus === 'upcoming') filtered.sort((a,b) => a.renewalDate.localeCompare(b.renewalDate));
    else if (activeStatus === 'new') filtered.sort((a,b) => b.joinedDate.localeCompare(a.joinedDate));
    data = {
      total: filtered.length,
      counts: {
        active: enriched.length,
        new: enriched.filter(m => new Date(m.joinedDate) > ago60).length,
        upcoming: enriched.filter(m => m.renewalDate >= today && new Date(m.renewalDate) <= in30).length,
        lapsed: enriched.filter(m => m.renewalDate < today && new Date(m.renewalDate) < ago14).length
      },
      members: filtered.slice(0, 100)
    };
  }
  render(data);
}

function render(data) {
  $('c-active').textContent = data.counts.active.toLocaleString();
  $('c-new').textContent = data.counts.new.toLocaleString();
  $('c-upcoming').textContent = data.counts.upcoming.toLocaleString();
  $('c-lapsed').textContent = data.counts.lapsed.toLocaleString();

  const titles = {
    active: 'All active members',
    new: 'New members (last 60 days)',
    upcoming: 'Upcoming renewals (next 30 days)',
    lapsed: 'Lapsed memberships'
  };
  $('list-title').textContent = titles[activeStatus] + ' · ' + data.total + ' showing';

  if (!data.members.length) {
    $('member-rows').innerHTML = '<p style="padding:48px;text-align:center;color:var(--muted);">No members in this category right now.</p>';
    return;
  }

  const today = new Date().toISOString().slice(0,10);
  $('member-rows').innerHTML = data.members.map(m => {
    const lapsed = m.renewalDate < today;
    const renewalDays = Math.round((new Date(m.renewalDate) - new Date()) / (24*3600*1000));
    const renewalDisplay = lapsed
      ? `<span class="lapsed">${m.renewalDate}<br><span style="font-size:.7rem;font-weight:400;">${Math.abs(renewalDays)}d ago</span></span>`
      : renewalDays <= 30
        ? `<span class="upcoming">${m.renewalDate}<br><span style="font-size:.7rem;font-weight:400;">in ${renewalDays}d</span></span>`
        : `<span>${m.renewalDate}</span>`;
    const showRenewBtn = activeStatus === 'lapsed' || activeStatus === 'upcoming';
    return `
      <div class="member-row">
        <div>
          <div class="member-row__name">${m.name}</div>
          <div class="member-row__sub">${m.contactName||'—'} · ${m.email||''}</div>
        </div>
        <div>
          <strong>${m.tier||'member'}</strong><br>
          <span class="member-row__sub">${m.category||''}</span>
        </div>
        <div class="member-row__date">${m.joinedDate}</div>
        <div>${renewalDisplay}</div>
        <div>
          ${showRenewBtn
            ? `<button class="row-action row-action--primary" onclick="generateEmail('${m.id}','${(m.name||'').replace(/'/g,"\\'")}')">✨ AI Renew Email</button>`
            : `<button class="row-action" onclick="window.open('../members/profile.html?id=${m.id}', '_blank')">View</button>`}
        </div>
      </div>`;
  }).join('');
}

document.querySelectorAll('#tabs .tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('#tabs .tab').forEach(x => x.classList.toggle('active', x===t));
  activeStatus = t.dataset.status;
  load();
}));
$('search').addEventListener('input', e => { activeQ = e.target.value; load(); });

// AI renewal email
async function generateEmail(memberId, memberName) {
  lastEmailContext = { memberId, memberName };
  $('em-title').textContent = `Renewal email for ${memberName}`;
  $('em-meta').textContent = 'Drafting…';
  $('em-body').innerHTML = '<div class="email-modal__loading">Diana\'s AI assistant is drafting…</div>';
  $('email-modal').classList.add('open');

  try {
    const r = await fetch(`/api/admin/members/${encodeURIComponent(memberId)}/renewal-email`, { method:'POST' });
    if (!r.ok) throw new Error('api ' + r.status);
    const data = await r.json();
    showEmail(data);
  } catch (e) {
    // Offline fallback — generate a template entirely client-side
    const dir = await fetch('/data/directory.json').then(r => r.json()).catch(() => []);
    const m = dir.find(x => x.id === memberId) || { name: memberName };
    const today = new Date().toISOString().slice(0,10);
    showEmail({
      member: { name: m.name, contactName: m.contactName || '', email: m.email || '', renewalDate: m.renewalDate || today, lapsed: false },
      subject: `${(m.contactName||'Hi').split(' ')[0]} — your ${m.name} chamber renewal`,
      body: `Hi ${m.contactName || 'there'},\n\nI wanted to reach out personally about your chamber-of-commerce membership for ${m.name}. Your renewal is coming up, and I'd love to see you back at the next mixer before that arrives.\n\nQuick reminder: you can renew online from your member portal, or grab 15 minutes by phone if you'd rather walk through it.\n\nStay Connected,\nDiana\nDiana Williams · CEO\nWest Valley Warner Center Chamber of Commerce\n(818) 347-4737`,
      tone: 'nudge',
      fallback: true
    });
  }
}

function showEmail(data) {
  $('em-meta').textContent = `${data.member.email || 'no email on file'} · renewal ${data.member.renewalDate}${data.fallback ? ' · (offline template — start backend for AI-drafted)' : ''}`;
  $('em-body').innerHTML = `
    <input type="text" class="email-modal__subject" id="em-subject" value="${(data.subject||'').replace(/"/g,'&quot;')}">
    <textarea class="email-modal__body-text" id="em-bodytext">${(data.body||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}</textarea>
  `;
}

function closeEmail() { $('email-modal').classList.remove('open'); }

function copyEmail() {
  const subject = $('em-subject').value;
  const body = $('em-bodytext').value;
  navigator.clipboard.writeText(`Subject: ${subject}\n\n${body}`);
  alert('Copied to clipboard.');
}

function sendEmail() {
  const subject = encodeURIComponent($('em-subject').value);
  const body = encodeURIComponent($('em-bodytext').value);
  // Find member email
  if (lastEmailContext) {
    fetch('/data/directory.json').then(r => r.json()).then(dir => {
      const m = dir.find(x => x.id === lastEmailContext.memberId);
      const to = m && m.email ? encodeURIComponent(m.email) : '';
      window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
    });
  }
}

function scheduleCall() {
  if (!lastEmailContext) return;
  fetch('/data/directory.json').then(r => r.json()).then(dir => {
    const m = dir.find(x => x.id === lastEmailContext.memberId) || {};
    const memberEmail = m.email || '';
    const memberName  = m.contactName || lastEmailContext.memberName;
    const business    = m.name || lastEmailContext.memberName;
    // Default: tomorrow at 10am Pacific, 15-min slot
    const start = new Date(); start.setDate(start.getDate() + 1); start.setHours(10, 0, 0, 0);
    const end = new Date(start); end.setMinutes(start.getMinutes() + 15);
    const fmt = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    const params = new URLSearchParams({
      action: 'TEMPLATE',
      text: `Renewal call: ${business} + Diana Williams`,
      details: `15-min renewal check-in call.\n\nMember: ${memberName}\nBusiness: ${business}\nEmail: ${memberEmail}\n\nDial-in: (818) 347-4737`,
      add: [memberEmail, 'diana@woodlandhillscc.net'].filter(Boolean).join(','),
      location: '(818) 347-4737',
      dates: `${fmt(start)}/${fmt(end)}`
    });
    window.open(`https://calendar.google.com/calendar/render?${params.toString()}`, '_blank');
  });
}

function regenerateEmail() {
  if (lastEmailContext) generateEmail(lastEmailContext.memberId, lastEmailContext.memberName);
}

load();
</script>
</body>
</html>
