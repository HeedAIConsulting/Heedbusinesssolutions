<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outreach · Diana's Console</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/chamber.css?v=6">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-shell">
  <div data-admin="side"></div>
  <main class="admin-main">
    <div data-admin="top"></div>
    <div class="admin-content">
      <div class="admin-page-head">
        <div>
          <div class="admin-page-head__sub">AI-generated email sequences for prospective members · approve or send</div>
          <h1>Outreach</h1>
        </div>
      </div>
      <!-- Real bulk-draft generator — Gemini + Microsoft 365 Graph -->
      <div class="admin-card" style="margin-bottom:24px;">
        <div class="admin-card__head" style="display:flex;justify-content:space-between;align-items:start;gap:16px;">
          <div>
            <div class="admin-card__title">Bulk email draft generator</div>
            <div class="text-xs text-muted">Filter members → Gemini writes a personalized email per recipient → drafts land in your Microsoft 365 Drafts folder for review.</div>
          </div>
          <div id="m365-status-pill" class="text-sm"></div>
        </div>
        <div class="admin-card__body">
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
            <div class="form-group"><label>Membership tier</label><select id="bd-tier"><option value="">Any tier</option><option>platinum</option><option>gold</option><option>silver</option><option>bronze</option><option>supporter</option><option>friend</option><option>member</option><option>community</option></select></div>
            <div class="form-group"><label>Category contains</label><input type="text" id="bd-category" placeholder="restaurant, healthcare…"></div>
            <div class="form-group"><label>Neighborhood</label><select id="bd-neighborhood"><option value="">Any</option><option>Woodland Hills</option><option>Tarzana</option><option>Reseda</option><option>Warner Center</option></select></div>
            <div class="form-group"><label>Limit (max 50)</label><input type="number" id="bd-limit" value="10" min="1" max="50"></div>
          </div>
          <div class="form-group">
            <label>Email intent (what do you want to say?)</label>
            <textarea id="bd-intent" rows="3" placeholder="e.g. Q2 renewal nudge — remind them their membership renews June 1, highlight 3 perks, soft CTA to confirm."></textarea>
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <button class="btn btn--outline btn--sm" id="bd-preview">Preview matches</button>
            <button class="btn btn--gold" id="bd-run">Generate &amp; save drafts to Outlook</button>
            <span id="bd-status" class="text-sm text-muted"></span>
          </div>
          <div id="bd-results" style="margin-top:16px;"></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="admin.js"></script>
<script src="_stub.js"></script>
<script>
AdminShell.mount({ active: 'outreach' });

// Bulk-draft generator — talks to /api/m365/bulk-draft
(function () {
  const API = window.CHAMBER_API_BASE || '/api';
  const $ = id => document.getElementById(id);
  const filter = () => ({
    tier: $('bd-tier').value || undefined,
    category: $('bd-category').value || undefined,
    neighborhood: $('bd-neighborhood').value || undefined,
    limit: parseInt($('bd-limit').value, 10) || 10,
    hasEmail: true
  });

  // Fetch M365 status and update the pill
  fetch(API + '/m365/status').then(r => r.json()).then(s => {
    const pill = $('m365-status-pill');
    if (!s.configured) {
      pill.innerHTML = '<span class="admin-pill admin-pill--gray">M365 not configured</span>';
    } else if (s.connected) {
      pill.innerHTML = '<span class="admin-pill admin-pill--green">M365 · ' + (s.connectedAs || 'connected') + '</span>';
    } else {
      const apiOrigin = (API || '/api').replace(/\/api\/?$/, '');
      pill.innerHTML = '<a href="' + apiOrigin + '/auth/m365/login" class="btn btn--gold btn--sm">Connect Microsoft 365 to enable drafts</a>';
    }
  }).catch(() => {});

  $('bd-preview').addEventListener('click', async () => {
    $('bd-status').textContent = 'Filtering members…';
    $('bd-results').innerHTML = '';
    try {
      const r = await fetch(API + '/m365/bulk-draft', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filter: filter(), intent: $('bd-intent').value || 'preview', dryRun: true })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Preview failed');
      $('bd-status').textContent = data.totalMatched + ' matched · would draft to ' + data.willDraft;
      const rows = (data.recipients || []).map(p => '<tr><td><strong>' + p.name + '</strong></td><td>' + (p.tier||'') + '</td><td>' + (p.category||'') + '</td><td>' + p.email + '</td></tr>').join('');
      $('bd-results').innerHTML =
        '<table class="admin-table"><thead><tr><th>Member</th><th>Tier</th><th>Category</th><th>Email</th></tr></thead><tbody>' + rows + '</tbody></table>';
    } catch (e) {
      $('bd-status').textContent = 'Error: ' + e.message;
    }
  });

  $('bd-run').addEventListener('click', async () => {
    if (!$('bd-intent').value.trim()) { $('bd-status').textContent = 'Enter an email intent first.'; return; }
    if (!confirm('Generate drafts for matched members and save them to Microsoft 365 Drafts? This calls Gemini once per recipient.')) return;
    $('bd-status').textContent = 'Generating drafts… (this can take 10–60s)';
    $('bd-results').innerHTML = '';
    try {
      const r = await fetch(API + '/m365/bulk-draft', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filter: filter(), intent: $('bd-intent').value })
      });
      const data = await r.json();
      if (!r.ok) {
        if (r.status === 401) {
          const apiOrigin = (API || '/api').replace(/\/api\/?$/, '');
          $('bd-status').innerHTML = 'Not connected to Microsoft 365. <a href="' + apiOrigin + '/auth/m365/login">Connect now →</a>';
          return;
        }
        throw new Error(data.error || 'Bulk draft failed');
      }
      const drafts = data.drafted || [];
      const failed = data.failed || [];
      $('bd-status').textContent = drafts.length + ' drafts saved to Outlook · ' + failed.length + ' failed';
      const rows = drafts.map(d => '<tr><td><strong>' + d.member + '</strong><br><span class="text-xs text-muted">' + d.email + '</span></td><td><a href="' + d.webLink + '" target="_blank" class="btn btn--outline btn--sm">Open in Outlook ↗</a></td></tr>').join('');
      $('bd-results').innerHTML = drafts.length
        ? '<div class="text-sm" style="margin-bottom:8px;">Drafts created — open any to review/edit/send:</div><table class="admin-table"><tbody>' + rows + '</tbody></table>'
        + (failed.length ? '<div class="text-sm text-muted" style="margin-top:8px;">Skipped: ' + failed.map(f => f.member + ' (' + f.reason + ')').join(', ') + '</div>' : '')
        : '<div class="text-sm text-muted">No drafts created. Check filter and try a Preview first.</div>';
    } catch (e) {
      $('bd-status').textContent = 'Error: ' + e.message;
    }
  });
})();
</script>
<script src="admin-hydrate.js"></script>
</body>
</html>
